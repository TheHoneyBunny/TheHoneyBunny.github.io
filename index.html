
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7f7f8;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin-bottom: 16px;
            object-fit: cover;
            border: 2px solid #eaeaea;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .bio {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: block;
            padding: 14px 20px;
            background: #ffffff;
            color: #111;
            text-decoration: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid #eaeaea;
            transition: all 0.2s ease;
        }

        .link-card:hover {
            border-color: #111;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Możesz wkleić link do własnego zdjęcia/awatara zamiast poniższego placeholderu -->
        <img class="avatar" src="https://via.placeholder.com/150/ffffff/000000?text=U" alt="Avatar">
        
        <h1>Twój Nick / Imię</h1>
        <p class="bio">Tutaj krótki opis – co robisz, czym się zajmujesz albo po prostu Twój status.</p>

        <div class="links">
            <!-- Podmień # na swoje pełne linki -->
            <a href="#" class="link-card" target="_blank" rel="noopener">Discord Server / Profile</a>
            <a href="#" class="link-card" target="_blank" rel="noopener">YouTube / Twitch</a>
            <a href="#" class="link-card" target="_blank" rel="noopener">X / Twitter</a>
            <a href="#" class="link-card" target="_blank" rel="noopener">Steam / Kick</a>
        </div>
    </div>

</body>
</html>
